[[plugins]]
    package = "netlify-plugin-11ty"
    [plugins.inputs]
        cache_img = './img'
        cache_img_httpHeader = false

        cache_assets = '../.cache'
        cache_other = ['../.bandcamp', '../.lastfm']

[[redirects]]
  from = "https://11ty.owlish.dev/*"
  to = "https://www.ovl.design/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://reading.ovl.design/*"
  to = "https://www.ovl.design/around-the-web/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ovl.design/atw"
  to = "https://www.ovl.design/around-the-web/"
  status = 301
  force = true

[[redirects]]
  from = "/around-the-web/013/"
  to = "/around-the-web/013-do-robots-eat-electric-salad/"
  status = 301
  force = true

[[redirects]]
  from = "/around-the-web/014/"
  to = "/around-the-web/014-just-go-aahh-hardcore/"
  status = 301
  force = true

# slugify 2.x -> 3.x changed apostrophe handling in v4 (can't: c-a-n-t -> cant).
# Preserves backlinks to post 020 published under Eleventy v3.
[[redirects]]
  from = "/around-the-web/020-you-c-a-n-t-spell-ai-without-c-a-p-i-t-a-l-i-s-m/"
  to = "/around-the-web/020-you-cant-spell-ai-without-c-a-p-i-t-a-l-i-s-m/"
  status = 301
  force = true